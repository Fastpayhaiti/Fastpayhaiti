<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>Change Password - DLM Wallet</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{
  --bg:#05070c;
  --panel:#10141d;
  --line:rgba(255,255,255,.08);
  --muted:#9299aa;
  --primary:#5662ff;
  --primary2:#7868ff;
  --good:#57e28b;
  --bad:#ff9099
}
body{background:var(--bg);color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:#151923;border:1px solid var(--line);padding:13px 16px;border-radius:15px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:900}
.hero,.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.title{font-size:31px;font-weight:950;margin:7px 0 8px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}
.input{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#111724;color:#fff;margin-bottom:12px;outline:0}
.input:focus{border-color:var(--primary)}
.pin-input{text-align:center;font-size:25px;font-weight:900;letter-spacing:12px;padding-left:12px}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.btn.secondary{background:#171c27;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.msg{display:none;padding:13px;border-radius:14px;margin-bottom:13px;line-height:1.45}
.msg.ok{display:block;background:rgba(34,197,94,.14);color:var(--good)}
.msg.err{display:block;background:rgba(239,68,68,.14);color:var(--bad)}
.option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:18px;background:#141925;border:1px solid var(--line);text-decoration:none;color:#fff;margin-top:10px}
.option-left{display:flex;align-items:center;gap:12px}
.option-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(86,98,255,.12);color:#c4c8ff}
.option b{display:block;font-size:14px}.option span{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}
.security-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
</style></head><body>
<div class="app">
<div class="top"><a class="back" href="security.html">← Security</a><div class="avatar" id="avatar">D</div></div>
<div class="hero"><div class="eyebrow">Password</div><div class="title">Change password</div><div class="sub">Changing your password signs other sessions out.</div></div>
<div class="card"><div id="msg" class="msg"></div>
<label>Current password</label><input class="input" id="current" type="password" autocomplete="current-password">
<label>New password</label><input class="input" id="newp" type="password" autocomplete="new-password" placeholder="10+ characters">
<label>Confirm new password</label><input class="input" id="confirm" type="password" autocomplete="new-password">
<button class="btn" id="btn" onclick="changePassword()">Change password</button>
<a href="forgot-password.html" style="display:block;text-align:center;margin-top:15px;color:#aab0ff;text-decoration:none;font-size:12px;font-weight:800">Forgot password?</a>
</div></div>
<script src="app.js"></script><script>
requireDlmLogin();
function show(t,ok=false){const e=document.getElementById("msg");e.className="msg "+(ok?"ok":"err");e.innerText=t}
async function changePassword(){const currentPassword=document.getElementById("current").value,newPassword=document.getElementById("newp").value,confirm=document.getElementById("confirm").value;if(newPassword!==confirm)return show("Nouvo modpas yo pa menm.");const b=document.getElementById("btn");b.disabled=true;b.innerText="Updating...";try{const d=await dlmApi("/password/change",{method:"POST",body:JSON.stringify({currentPassword,newPassword})});if(d.token){localStorage.setItem("dlm_token",d.token);saveDlmSession({token:d.token,user:d.user})}clearPinUnlock();show(d.message||"Password changed.",true);setTimeout(()=>location.href="dashboard.html",1000)}catch(e){show(e.message)}finally{b.disabled=false;b.innerText="Change password"}}
</script><script src="app.js"></script><script>requireDlmLogin();</script></body></html>
