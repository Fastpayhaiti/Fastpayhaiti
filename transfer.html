<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfer - DLM Wallet</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#05070c;color:#fff;min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 110px;background:radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 28%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 25%),#05070c}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:13px 16px;border-radius:14px}.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-weight:800}.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:18px}.title{font-size:30px;font-weight:800;margin-bottom:10px}.sub{color:#8b93a7;line-height:1.5;margin-bottom:16px}.balance{font-size:34px;font-weight:800}.input{width:100%;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1);background:#11172a;color:#fff;margin:8px 0 14px}.btn{width:100%;padding:16px;border:0;border-radius:17px;background:#2f3cff;color:#fff;font-weight:800;font-size:16px}.msg{margin-top:14px;padding:13px;border-radius:13px;display:none}.ok{display:block;background:rgba(34,197,94,.14);color:#4ade80}.err{display:block;background:rgba(239,68,68,.14);color:#f87171}</style></head><body><div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="av">A</div></div><div class="card"><div class="title">Transfer</div><div class="sub">Balans aktyèl ou</div><div class="balance" id="bal">0 HTG</div></div><div class="card"><label>Email moun k ap resevwa a</label><input class="input" id="recipient" type="email" placeholder="email@example.com"><label>Montan HTG</label><input class="input" id="amount" type="number" min="1" placeholder="Antre montan an"><button class="btn" onclick="sendMoney()">Voye</button><div id="msg" class="msg"></div></div></div><script src="app.js"></script><script>let u=requireLogin();if(u){av.textContent=(u.fullname||'A')[0].toUpperCase();bal.textContent=getUserBalance(u)+' HTG';}function sendMoney(){const email=recipient.value.trim().toLowerCase(),a=Number(amount.value),m=msg;if(!email||!a||a<=0){m.className='msg err';m.textContent='Ranpli email ak montan an.';return;}if(email===String(u.email).toLowerCase()){m.className='msg err';m.textContent='Ou pa ka voye lajan bay pwòp kont ou.';return;}if(getUserBalance(u)<a){m.className='msg err';m.textContent='Balans ou pa sifi.';return;}const users=getUsers(),i=users.findIndex(x=>String(x.email||'').toLowerCase()===email);if(i<0){m.className='msg err';m.textContent='Kont kliyan sa pa jwenn sou aparèy sa a.';return;}u.balance=getUserBalance(u)-a;users[i].balance=Number(users[i].balance||0)+a;saveUsers(users.map(x=>x.id===u.id?u:x));saveCurrentUser(u);bal.textContent=u.balance+' HTG';m.className='msg ok';m.textContent='Transfè a fèt avèk siksè.';recipient.value='';amount.value='';}</script></body></html>
