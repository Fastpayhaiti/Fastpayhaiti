<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Fire - DLM Wallet</title>
<style>:root{--accent:#f6a800;--accent2:#ff6b00}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--bg:#06080d;--panel:#10131b;--panel2:#151925;--muted:#9199ab;--line:rgba(255,255,255,.08)}
body{background:var(--bg);color:#fff;min-height:100vh}
.app{max-width:460px;margin:auto;min-height:100vh;padding:20px 18px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;background:#151923;border:1px solid var(--line);padding:13px 16px;border-radius:15px}
.avatar{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hero,.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.hero{position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-75px;top:-90px;background:var(--accent);opacity:.13}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.title{font-size:32px;font-weight:950;line-height:1.08;margin:7px 0 10px;position:relative;z-index:1}
.sub{color:var(--muted);line-height:1.55;position:relative;z-index:1}
.balance{font-size:34px;font-weight:950;margin-top:7px;position:relative;z-index:1}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 7px;color:#dbe1ee}
.input,.select{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#111724;color:#fff;margin-bottom:12px;outline:none}
.input:focus,.select:focus{border-color:var(--accent)}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.btn.secondary{background:#171c28;border:1px solid var(--line)}
.btn:disabled{opacity:.52;cursor:not-allowed}
.msg{display:none;padding:13px;border-radius:14px;margin-bottom:13px;line-height:1.45}
.msg.ok{display:block;background:rgba(34,197,94,.14);color:#5ee48b}
.msg.err{display:block;background:rgba(239,68,68,.14);color:#ff8f98}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:1px solid var(--line);background:#141824;color:#fff;border-radius:14px;padding:13px;font-weight:850;cursor:pointer;text-align:left}
.product{margin-top:12px;padding:16px;border-radius:18px;background:#121621;border:1px solid var(--line);cursor:pointer}
.product h3{font-size:17px;margin-bottom:6px}.product-meta{font-size:12px;color:var(--muted);line-height:1.5}
.tag{display:inline-flex;margin-top:9px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.06);font-size:11px;color:#c8cfdd}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.show{display:flex}.modal{width:100%;max-width:460px;background:#0d1119;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:21px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.close{border:0;background:#1a1f2b;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px}
.amounts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.amount{border:1px solid var(--line);background:#171c27;color:#fff;border-radius:13px;padding:10px 12px;font-weight:800;cursor:pointer}
.amount.active{outline:2px solid var(--accent)}
.payment{border:1px solid var(--line);background:#121722;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.payment.active{border-color:var(--accent);background:rgba(255,255,255,.055)}
.status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.07)}

/* ===== DLM FREE FIRE PRODUCT IMAGE UPGRADE ===== */
.ff-brand{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
  position:relative;z-index:1;
}
.ff-brand-logo{
  width:68px;height:68px;border-radius:17px;object-fit:cover;
  background:#111;padding:4px;border:1px solid rgba(255,255,255,.10);
}
.product{
  display:grid;
  grid-template-columns:78px 1fr;
  gap:14px;
  align-items:center;
  overflow:hidden;
}
.product-logo-wrap{
  width:78px;height:78px;border-radius:16px;background:#111;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.product-logo{width:100%;height:100%;object-fit:contain;padding:6px}
.product-copy{min-width:0}
.product-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-weight:950;font-size:22px;color:#f6a800;background:#151925;
}
.modal-product-row{display:flex;gap:12px;align-items:center}
.modal-product-logo{
  width:58px;height:58px;border-radius:14px;object-fit:contain;background:#111;padding:5px;
}

</style></head><body>
<div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="avatar">D</div></div>
<div class="hero"><div class="eyebrow">Gaming</div><div class="title">Free Fire</div><div class="sub">Chwazi voucher/diamonds ki disponib, antre Free Fire Player ID la, verifye montan an, epi kontinye.</div><div class="small" style="margin-top:16px">Wallet balance</div><div id="serviceBalance" class="balance">$0.00 USD</div></div>
<div class="card"><div id="msg" class="msg"></div><button class="btn" id="searchBtn" onclick="loadFF()">Load Free Fire products</button><div id="products"></div></div></div>
<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div class="modal-product-row"><img id="pLogo" class="modal-product-logo" alt="Free Fire product" style="display:none"><div><div class="eyebrow">Free Fire checkout</div><div class="title" style="font-size:23px" id="pName"></div><div class="small" id="pMeta"></div></div></div><button class="close" onclick="closeModal()">×</button></div>
<div id="modalMsg" class="msg"></div><div id="amountArea"></div><label>Free Fire Player ID</label><input class="input" id="playerId" inputmode="numeric" placeholder="Antre Player ID ou">
<label>Recipient email</label><input class="input" id="recipientEmail" type="email"><button class="btn" id="buyBtn" onclick="buyFF()">Continue</button><button class="btn secondary" style="margin-top:10px" onclick="closeModal()">Cancel</button></div></div>
<script src="app.js"></script><script>
requireDlmLogin();let products=[],selected=null;
syncDlmServiceBalance("serviceBalance");
function escFF(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function ffProductLogo(p){
 const c=[p?.logoUrls?.[0],p?.logoUrls?.[1],p?.logoUrl,p?.brand?.logoUrl,p?.imageUrl,p?.image];
 return c.find(v=>typeof v==="string" && /^https?:\/\//i.test(v)) || "";
}
function ffFallback(el,name){
 const wrap=el.parentElement;if(!wrap)return;
 wrap.innerHTML=`<div class="product-fallback">${escFF(String(name||"FF").trim().slice(0,2).toUpperCase())}</div>`;
}

function msg(t,ok=false,id="msg"){const e=document.getElementById(id);e.className="msg "+(ok?"ok":"err");e.innerText=t}
function fixed(p){const a=p.fixedRecipientDenominations||p.fixedSenderDenominations||[];return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}
function country(p){return p?.country?.isoName||p?.country?.isoCode||p?.countryCode||"US"}
function currency(p){return p?.recipientCurrencyCode||p?.currencyCode||"USD"}
async function loadFF(){const b=document.getElementById("searchBtn");b.disabled=true;b.innerText="Loading...";try{const d=await dlmApi("/reloadly/giftcards?search=Free%20Fire");products=d.products||[];document.getElementById("products").innerHTML=products.map((p,i)=>`<div class="product" onclick="openP(${i})"><h3>${p.productName||"Free Fire"}</h3><div class="product-meta">${country(p)} • Product ID ${p.productId||p.id}</div><span class="tag">Select product</span></div>`).join("")||'<div class="small">Pa gen Free Fire pwodwi jwenn.</div>'}catch(e){msg(e.message)}finally{b.disabled=false;b.innerText="Load Free Fire products"}}
async function openP(i){selected=products[i];try{const d=await dlmApi(`/reloadly/giftcards/${selected.productId||selected.id}`);selected=d.product||selected}catch(e){}
 document.getElementById("pName").innerText=selected.productName||"Free Fire";document.getElementById("pMeta").innerText=`${country(selected)} • ${currency(selected)}`;
 const pl=ffProductLogo(selected),pi=document.getElementById("pLogo");
 if(pl){pi.src=pl;pi.style.display="block";pi.onerror=()=>{pi.style.display="none"}}else{pi.removeAttribute("src");pi.style.display="none"};
 const a=fixed(selected),area=document.getElementById("amountArea");
 if(a.length){area.innerHTML='<label>Available amounts</label><div class="amounts">'+a.map((v,ix)=>`<button class="amount ${ix===0?"active":""}" onclick="pick(${v},this)">${v} ${currency(selected)}</button>`).join("")+'</div><input type="hidden" id="amount" value="'+a[0]+'">'}
 else{const min=Number(selected.minRecipientDenomination||selected.minSenderDenomination||0),max=Number(selected.maxRecipientDenomination||selected.maxSenderDenomination||0);area.innerHTML=`<label>Amount</label><input class="input" id="amount" type="number" min="${min||0.01}" ${max?`max="${max}"`:""} step="0.01">`}
 document.getElementById("recipientEmail").value=getDlmUser()?.email||"";document.getElementById("modal").classList.add("show")}
function pick(v,el){document.getElementById("amount").value=v;document.querySelectorAll(".amount").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
async function buyFF(){const playerId=document.getElementById("playerId").value.trim(),amount=Number(document.getElementById("amount").value),recipientEmail=document.getElementById("recipientEmail").value.trim(),productId=Number(selected.productId||selected.id);
 if(!/^[0-9A-Za-z_-]{4,40}$/.test(playerId))return msg("Antre yon Free Fire Player ID valab.",false,"modalMsg");if(!amount||amount<=0)return msg("Chwazi yon montan.",false,"modalMsg");
 if(!confirm(`Konfime Free Fire order pou $${amount.toFixed(2)}?`))return;const b=document.getElementById("buyBtn");b.disabled=true;b.innerText="Processing...";
 try{const d=await dlmApi("/reloadly/giftcards/order",{method:"POST",body:JSON.stringify({productId,quantity:1,unitPrice:amount,countryCode:country(selected),recipientEmail,additionalRequirements:{userId:playerId}})});msg(d.message||"Order la reyisi.",true,"modalMsg");await syncDlmServiceBalance("serviceBalance")}
 catch(e){msg(e.message,false,"modalMsg");b.disabled=false;b.innerText="Continue"}}
window.addEventListener("DOMContentLoaded",()=>setTimeout(loadFF,120));
</script></body></html>
