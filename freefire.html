<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Fire - DLM Wallet</title>
<style>:root{--accent:#F6A800;--accent2:#FF6B00}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05070c;color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 80px;background:#05070c}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.08);padding:13px 16px;border-radius:14px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}
.hero,.card{background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;margin-bottom:18px}
.title{font-size:34px;font-weight:900;margin-bottom:10px}
.sub{color:#9aa2b4;line-height:1.5;margin-bottom:16px}
.small{font-size:12px;color:#8b93a7;line-height:1.45}.balance{font-size:34px;font-weight:900;margin-top:5px}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 7px;color:#d7deee}
.input{width:100%;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1);background:#11172a;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.btn.secondary{background:#171b26;border:1px solid rgba(255,255,255,.1)}
.btn:disabled{opacity:.55}
.msg{margin:0 0 14px;padding:13px;border-radius:13px;display:none;line-height:1.45}
.ok{display:block;background:rgba(34,197,94,.14);color:#4ade80}.err{display:block;background:rgba(239,68,68,.14);color:#f87171}
.product{margin-top:12px;padding:16px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.product-name{font-size:17px;font-weight:900}.product-meta{font-size:12px;color:#8b93a7;margin-top:7px;line-height:1.45}
.product-action{display:inline-block;margin-top:10px;color:var(--accent);font-size:13px;font-weight:900}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-wrap.show{display:flex}.modal{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:#0d111b;border:1px solid rgba(255,255,255,.09);border-radius:26px 26px 0 0;padding:22px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.modal-title{font-size:23px;font-weight:900}.close{width:40px;height:40px;border:0;border-radius:12px;background:#1a1f2c;color:#fff;font-size:20px}
.price-chip{display:inline-block;background:rgba(255,255,255,.07);color:#fff;border:0;padding:8px 10px;border-radius:12px;margin:4px 6px 4px 0;font-size:13px}
</style></head><body>
<div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="avatar">D</div></div>
<div class="hero"><div class="title">Free Fire</div><div class="sub">Free Fire vouchers ak ton jòn/oranj li yo.</div><div class="small">Balance</div><div id="serviceBalance" class="balance">$0.00 USD</div></div>
<div class="card"><div id="msg" class="msg"></div><label>Search</label><input class="input" id="search" value="Free Fire">
<button class="btn" id="searchBtn" onclick="searchProducts()">Search products</button><div id="products"></div></div></div>

<div class="modal-wrap" id="buyModal"><div class="modal">
<div class="modal-head"><div><div class="small">Selected product</div><div class="modal-title" id="selectedName"></div><div class="product-meta" id="selectedMeta"></div></div><button class="close" onclick="closeBuyModal()">×</button></div>
<div id="modalMsg" class="msg"></div><div id="fixedAmounts"></div>
<label>Amount</label><input class="input" id="buyAmount" type="number" min="0.01" step="0.01">
<label>Quantity</label><input class="input" id="buyQty" type="number" min="1" step="1" value="1">
<label>Recipient email</label><input class="input" id="recipientEmail" type="email" placeholder="Email pou resevwa gift card la">
<button class="btn" id="purchaseBtn" onclick="purchaseSelected()">Continue to purchase</button>
<button class="btn secondary" style="margin-top:10px" onclick="closeBuyModal()">Cancel</button>
</div></div>

<script src="app.js"></script><script>
requireDlmLogin();
let productStore=[],selectedProduct=null;
function showMsg(t,o=false,id="msg"){const m=document.getElementById(id);m.className=o?"msg ok":"msg err";m.innerText=t}
function fixedAmounts(p){const a=p.fixedRecipientDenominations||p.fixedSenderDenominations||[];return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}
function country(p){return p?.country?.isoName||p?.country?.isoCode||p?.countryCode||"US"}
function currency(p){return p?.recipientCurrencyCode||p?.currencyCode||"USD"}
async function searchProducts(){
 const q=document.getElementById("search").value.trim(),btn=document.getElementById("searchBtn"); if(!q)return showMsg("Antre yon pwodwi pou chèche.");
 btn.disabled=true;btn.innerText="Searching...";
 try{const data=await dlmApi(`/reloadly/giftcards?search=${encodeURIComponent(q)}`);productStore=data.products||data.content||[];const box=document.getElementById("products");
 if(!productStore.length){box.innerHTML='<div class="small" style="margin-top:14px">Pa gen pwodwi jwenn.</div>';return}
 box.innerHTML=productStore.slice(0,30).map((p,i)=>{const id=p.productId||p.id||"",n=p.productName||p.name||"Free Fire",a=fixedAmounts(p),cur=currency(p);return `<div class="product" onclick="openProduct(${i})"><div class="product-name">${n}</div><div class="product-meta">Product ID: ${id}${a.length?`<br>Amounts: ${a.slice(0,6).join(", ")} ${cur}`:""}</div><span class="product-action">Tap to buy →</span></div>`}).join("")
 }catch(e){showMsg(e.message)}finally{btn.disabled=false;btn.innerText="Search products"}
}
function openProduct(i){selectedProduct=productStore[i];if(!selectedProduct)return;const n=selectedProduct.productName||selectedProduct.name||"Free Fire",id=selectedProduct.productId||selectedProduct.id||"",a=fixedAmounts(selectedProduct),cur=currency(selectedProduct);
 document.getElementById("selectedName").innerText=n;document.getElementById("selectedMeta").innerText=`Product ID: ${id} • ${country(selectedProduct)} • ${cur}`;
 const amt=document.getElementById("buyAmount"),chips=document.getElementById("fixedAmounts"); if(a.length){chips.innerHTML='<label>Available amounts</label>'+a.map(v=>`<button type="button" class="price-chip" onclick="pickAmount(${v})">${v} ${cur}</button>`).join("");amt.value=a[0];amt.readOnly=true}else{chips.innerHTML="";amt.readOnly=false;amt.value=selectedProduct.minRecipientDenomination||selectedProduct.minSenderDenomination||""}
 const u=getDlmUser();document.getElementById("recipientEmail").value=u?.email||"";document.getElementById("buyQty").value="1";document.getElementById("buyModal").classList.add("show")
}
function pickAmount(v){document.getElementById("buyAmount").value=v}
function closeBuyModal(){document.getElementById("buyModal").classList.remove("show")}
async function purchaseSelected(){
 const productId=Number(selectedProduct?.productId||selectedProduct?.id),amount=Number(document.getElementById("buyAmount").value),quantity=Number(document.getElementById("buyQty").value),recipientEmail=document.getElementById("recipientEmail").value.trim(),btn=document.getElementById("purchaseBtn");
 if(!Number.isInteger(productId)||productId<=0)return showMsg("Product ID pa valab.",false,"modalMsg"); if(!Number.isFinite(amount)||amount<=0)return showMsg("Chwazi yon montan valab.",false,"modalMsg"); if(!recipientEmail.includes("@"))return showMsg("Antre yon email valab.",false,"modalMsg");
 if(!confirm(`Konfime acha pou $${(amount*quantity).toFixed(2)}?`))return; btn.disabled=true;btn.innerText="Processing...";
 try{const data=await dlmApi("/reloadly/giftcards/order",{method:"POST",body:JSON.stringify({productId,quantity,unitPrice:amount,amount,countryCode:country(selectedProduct),recipientEmail})});showMsg(data.message||"Acha a reyisi.",true,"modalMsg");const u=await refreshDlmUser();if(u)document.getElementById("serviceBalance").innerText=`$${Number(u.balance||0).toFixed(2)} USD`}
 catch(e){showMsg(e.message,false,"modalMsg");btn.disabled=false;btn.innerText="Continue to purchase"}
}
window.addEventListener("DOMContentLoaded",()=>setTimeout(searchProducts,120));
</script></body></html>
