<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cards - DLM Wallet</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="fixed-bottom-nav.css"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--bg:#05070c;--panel:#10141d;--line:rgba(255,255,255,.08);--muted:#9199ab;--primary:#5662ff;--primary2:#7868ff}
body{background:var(--bg);color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:#151923;border:1px solid var(--line);padding:13px 16px;border-radius:15px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:900}
.hero,.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.title{font-size:31px;font-weight:950;margin:7px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.balance{font-size:35px;font-weight:950;margin-top:7px}
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0}.step{height:5px;border-radius:999px;background:#252a36}.step.active{background:linear-gradient(90deg,var(--primary),var(--primary2))}
label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}.input,.select{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#111724;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;font-weight:900}.btn.secondary{background:#171c27;border:1px solid var(--line)}.btn:disabled{opacity:.5}
.msg{display:none;padding:13px;border-radius:14px;margin-bottom:13px}.msg.ok{display:block;background:rgba(34,197,94,.14);color:#5ee48b}.msg.err{display:block;background:rgba(239,68,68,.14);color:#ff8f98}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}.row:last-child{border-bottom:0}
.small{font-size:11px;color:var(--muted);line-height:1.45}.strong{font-weight:900}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.07)}.pill.good{background:rgba(54,214,125,.12);color:#59e38c}.pill.warn{background:rgba(250,204,21,.12);color:#facc15}.pill.bad{background:rgba(239,68,68,.12);color:#ff8e96}
.upload{display:block;border:1px dashed rgba(255,255,255,.16);border-radius:17px;padding:18px;text-align:center;background:#111620;cursor:pointer;margin-bottom:12px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
.card-visual{height:190px;border-radius:26px;padding:22px;background:linear-gradient(135deg,#1a2030,#0d1018);border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:16px}.card-visual:before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:#5662ff;opacity:.22;right:-70px;top:-70px}.logo{font-weight:950;font-size:18px}.masked{position:absolute;left:22px;bottom:58px;font-size:21px;letter-spacing:3px;font-weight:900}.holder{position:absolute;left:22px;bottom:22px;font-size:12px;color:#c9cfda;text-transform:uppercase}
.wallet-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.balance-box{background:#0c111a;border:1px solid var(--line);border-radius:18px;padding:14px}.balance-box small{color:var(--muted);font-weight:800}.balance-box b{display:block;font-size:20px;margin-top:7px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.action-btn{border:1px solid var(--line);background:#171c27;color:#fff;border-radius:15px;padding:13px 8px;font-weight:900}.action-btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border:0}.action-btn:disabled{opacity:.45}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:999}.modal.show{display:flex}.sheet{width:100%;max-width:430px;margin:auto;background:#0c1018;border-radius:25px 25px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#171c27;color:#fff;border:1px solid var(--line)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.quick button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:#151a24;color:#fff}
</style></head><body>
<div class="app">
<div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="avatar">D</div></div>
<div class="hero"><div class="eyebrow">DLM Wallet Cards</div><div class="title">Your card</div><div class="sub">Jere balans DLM Wallet ou ak balans kat ou apa.</div>
<div class="wallet-summary"><div class="balance-box"><small>DLM WALLET BALANCE</small><b id="walletBalance">$0.00 USD</b></div><div class="balance-box"><small>CARD BALANCE</small><b id="cardBalance">$0.00 USD</b></div></div>
<div class="card-actions"><button id="addFundsBtn" class="action-btn primary" onclick="openMoney('fund')">↑ Add funds</button><button id="moveBackBtn" class="action-btn" onclick="openMoney('unfund')">↓ Move to Wallet</button></div></div>
<div class="card-visual"><div class="logo">DLM Wallet</div><div class="masked">•••• •••• ••••</div><div class="holder" id="holderName">DLM USER</div></div>
<div class="card"><div id="msg" class="msg"></div>
<div class="row"><span class="small">KYC</span><span id="kycPill" class="pill warn">Checking</span></div>
<div class="row"><span class="small">Balance</span><span id="balance" class="strong">$0.00 USD</span></div>
<div class="row"><span class="small">Card fee</span><span class="strong">$10.00 USD</span></div>
<div class="row"><span class="small">Request</span><span id="requestPill" class="pill">None</span></div>
<button class="btn" style="margin-top:15px" onclick="startFlow()">Continue</button>
</div></div>
<div class="modal" id="moneyModal"><div class="sheet"><div class="sheet-head"><div><div class="eyebrow" id="moveLabel"></div><div class="title" id="moveTitle" style="font-size:22px"></div></div><button class="close" onclick="closeMoney()">×</button></div><div id="moneyMsg" class="msg"></div><label>Amount (USD)</label><input id="moneyAmount" class="input" type="number" min="0.01" step="0.01" placeholder="40.00"><div class="quick"><button onclick="setAmt(10)">$10</button><button onclick="setAmt(20)">$20</button><button onclick="setAmt(40)">$40</button><button onclick="setAmt(50)">$50</button></div><button id="moneyBtn" class="btn" onclick="submitMoney()">Confirm</button></div></div><div class="bottom-nav"><a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="statement.html" class="nav-item"><i class="fa-solid fa-arrow-rotate-left"></i><span>Transactions</span></a><a href="services.html" class="nav-item"><i class="fa-brands fa-bitcoin"></i><span>Services</span></a><a href="card-dashboard.html" class="nav-item active"><i class="fa-regular fa-credit-card"></i><span>Cards</span></a><a href="wallet.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a></div>
<script src="app.js"></script><script>
requireDlmLogin();let s=null,moveMode="fund";
function pill(id,status){const e=document.getElementById(id);e.className="pill "+((status==="verified"||status==="approved")?"good":status==="rejected"?"bad":"warn");e.innerText=status}
const money=v=>"$"+Number(v||0).toFixed(2)+" USD";
async function load(){const u=getDlmUser();if(u){const n=u.fullname||u.name||"DLM USER";holderName.innerText=n.toUpperCase();avatar.innerText=n.charAt(0).toUpperCase()}try{s=await dlmApi("/card/status");walletBalance.innerText=money(s.walletBalance??s.balance);cardBalance.innerText=money(s.cardBalance);balance.innerText=money(s.walletBalance??s.balance);pill("kycPill",s.kycStatus);pill("requestPill",s.cardRequest?.status||"none");addFundsBtn.disabled=s.cardRequest?.status!=="approved";moveBackBtn.disabled=Number(s.cardBalance||0)<=0}catch(e){}}
function startFlow(){if(!s)return;if(s.kycStatus!=="verified"){location.href="kyc.html";return}location.href="card-create.html"}
function openMoney(mode){if(!s)return;if(mode==="fund"&&s.cardRequest?.status!=="approved")return;if(mode==="unfund"&&Number(s.cardBalance||0)<=0)return;moveMode=mode;moneyAmount.value="";moneyMsg.className="msg";moveLabel.innerText=mode==="fund"?"DLM WALLET → CARD":"CARD → DLM WALLET";moveTitle.innerText=mode==="fund"?"Add funds to card":"Move to Wallet";moneyModal.classList.add("show")}
function closeMoney(){moneyModal.classList.remove("show")}
function setAmt(v){moneyAmount.value=Number(v).toFixed(2)}
async function submitMoney(){const amount=Number(moneyAmount.value);if(!Number.isFinite(amount)||amount<=0){moneyMsg.className="msg err";moneyMsg.innerText="Antre yon montan valab.";return}moneyBtn.disabled=true;try{const d=await dlmApi(moveMode==="fund"?"/card/fund":"/card/unfund",{method:"POST",body:JSON.stringify({amount})});moneyMsg.className="msg ok";moneyMsg.innerText=d.message;await load();setTimeout(closeMoney,650)}catch(e){moneyMsg.className="msg err";moneyMsg.innerText=e.message||"Operasyon an pa rive fèt."}finally{moneyBtn.disabled=false}}
load();
</script></body></html>
