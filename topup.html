<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topup - DLM Wallet</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05070c;color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 70px;background:radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 28%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 25%),#05070c}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:13px 16px;border-radius:14px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-weight:800}
.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:18px}
.title{font-size:30px;font-weight:800;margin-bottom:10px}
.sub{color:#8b93a7;line-height:1.5;margin-bottom:16px}
.balance{font-size:32px;font-weight:800;margin-top:5px}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 7px;color:#d7deee}
.input{width:100%;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1);background:#11172a;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:#2f3cff;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{margin-top:14px;padding:13px;border-radius:13px;display:none;line-height:1.45}
.ok{display:block;background:rgba(34,197,94,.14);color:#4ade80}
.err{display:block;background:rgba(239,68,68,.14);color:#f87171}
.small{font-size:12px;color:#8b93a7;line-height:1.5}
.product{margin-top:12px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}</style></head><body><div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="avatar">D</div></div><div class="card"><div class="title">Topup</div><div class="sub">Recharge yon nimewo telefòn atravè Reloadly ak balance DLM Wallet ou.</div><div class="small">Balance</div><div id="serviceBalance" class="balance">$0.00 USD</div></div><div class="card"><div id="msg" class="msg"></div><label>Country code</label><input class="input" id="countryCode" value="HT" maxlength="2" placeholder="HT"><label>Phone number</label><input class="input" id="phone" type="tel" placeholder="Eg. 509XXXXXXXX"><label>Amount (USD)</label><input class="input" id="amount" type="number" min="0.01" step="0.01" placeholder="Eg. 5"><button class="btn" id="buyBtn" onclick="buyTopup()">Recharge</button></div></div><script src="app.js"></script><script>
requireDlmLogin();
function showMsg(text,ok=false){const m=document.getElementById("msg");m.className=ok?"msg ok":"msg err";m.innerText=text;}
async function buyTopup(){const phone=document.getElementById("phone").value.trim();const countryCode=document.getElementById("countryCode").value.trim().toUpperCase();const amount=Number(document.getElementById("amount").value);const btn=document.getElementById("buyBtn");if(!phone||!countryCode||!Number.isFinite(amount)||amount<=0){showMsg("Ranpli nimewo, country code ak montan an.");return;}if(!confirm(`Konfime topup $${amount.toFixed(2)} USD pou ${phone}?`)){return;}btn.disabled=true;btn.innerText="Ap trete...";try{const data=await dlmApi("/reloadly/topup",{method:"POST",body:JSON.stringify({phone,countryCode,amount})});showMsg(data.message||"Topup la reyisi.",true);const user=await refreshDlmUser();if(user){document.getElementById("serviceBalance").innerText=`$${Number(user.balance||0).toFixed(2)} USD`;}}catch(error){showMsg(error.message);}finally{btn.disabled=false;btn.innerText="Recharge";}}
</script></body></html>
