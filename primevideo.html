<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Video - DLM Wallet</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#05070c;color:#fff;min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 70px;background:radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 28%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 25%),#05070c}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:13px 16px;border-radius:14px}.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-weight:800}.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:18px}.title{font-size:30px;font-weight:800;margin-bottom:10px}.sub{color:#8b93a7;line-height:1.5;margin-bottom:16px}.balance{font-size:32px;font-weight:800}.input,select{width:100%;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1);background:#11172a;color:#fff;margin:8px 0 14px}.btn{width:100%;padding:16px;border:0;border-radius:17px;background:#2f3cff;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:13px;border-radius:13px;display:none}.ok{display:block;background:rgba(34,197,94,.14);color:#4ade80}.err{display:block;background:rgba(239,68,68,.14);color:#f87171}.small{font-size:12px;color:#8b93a7;line-height:1.5}.product{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:16px;margin-top:12px;background:rgba(255,255,255,.03)}.product img{width:54px;height:54px;object-fit:contain;border-radius:10px;background:#fff}.row{display:flex;gap:12px;align-items:center}.product-name{font-weight:800}.priceBtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.priceBtn{border:1px solid rgba(255,255,255,.12);background:#11172a;color:#fff;border-radius:10px;padding:8px 10px}.priceBtn.active{border-color:#5362ff;background:rgba(83,98,255,.2)}</style></head><body><div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="avatar">D</div></div><div class="card"><div class="title">Prime Video</div><div class="sub">Chèche pwodwi Reloadly epi achte li ak balance DLM Wallet ou.</div><div id="serviceBalance" class="balance">$0.00 USD</div></div><div class="card"><div id="msg" class="msg"></div><label>Country</label><input id="country" class="input" value="US" maxlength="2"><label>Search</label><input id="search" class="input" value="Amazon"><button class="btn" onclick="loadProducts()">Search products</button><div id="products"></div></div></div><script src="app.js"></script><script>requireDlmLogin();let products=[];function showMsg(t,ok=false){const e=document.getElementById('msg');e.className=ok?'msg ok':'msg err';e.innerText=t;}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}async function loadProducts(){try{const cc=document.getElementById('country').value.trim().toUpperCase();const q=document.getElementById('search').value.trim().toLowerCase();const d=await dlmApi(`/reloadly/giftcards/products?countryCode=${encodeURIComponent(cc)}&size=100&page=1`);const raw=d.products;products=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.content)?raw.content:[]);const matches=products.filter(p=>!q||String(p.productName||'').toLowerCase().includes(q)||String(p.brand?.brandName||'').toLowerCase().includes(q));const box=document.getElementById('products');if(!matches.length){box.innerHTML='<div class="small" style="margin-top:15px">Pa gen pwodwi jwenn nan peyi sa.</div>';return;}box.innerHTML=matches.slice(0,25).map(p=>{const prices=Array.isArray(p.fixedRecipientDenominations)&&p.fixedRecipientDenominations.length?p.fixedRecipientDenominations:[];const priceHtml=prices.length?`<select class="input" id="price-${p.productId}">${prices.map(v=>`<option value="${v}">${v} ${esc(p.recipientCurrencyCode||'')}</option>`).join('')}</select>`:`<input class="input" id="price-${p.productId}" type="number" min="${p.minRecipientDenomination||0.01}" max="${p.maxRecipientDenomination||p.maxrecipientDenomination||9999}" step="0.01" placeholder="Amount ${esc(p.recipientCurrencyCode||'')}">`;return `<div class="product"><div class="row">${p.logoUrls?.[0]?`<img src="${esc(p.logoUrls[0])}" alt="">`:''}<div><div class="product-name">${esc(p.productName)}</div><div class="small">${esc(p.country?.name||'')} · ${esc(p.recipientCurrencyCode||'')}</div></div></div>${priceHtml}<input class="input" id="email-${p.productId}" type="email" value="${esc(getDlmUser()?.email||'')}" placeholder="Recipient email"><button class="btn" onclick="buy(${p.productId})">Buy</button><div id="result-${p.productId}" class="small" style="margin-top:10px"></div></div>`;}).join('');}catch(e){showMsg(e.message);}}async function buy(id){const p=products.find(x=>Number(x.productId)===Number(id));if(!p)return;const price=Number(document.getElementById(`price-${id}`).value);const email=document.getElementById(`email-${id}`).value.trim();if(!Number.isFinite(price)||price<=0){showMsg('Chwazi yon denomination valab.');return;}if(!confirm(`Konfime acha ${p.productName} ${price} ${p.recipientCurrencyCode||''}?`))return;try{const d=await dlmApi('/reloadly/giftcards/orders',{method:'POST',body:JSON.stringify({productId:Number(id),quantity:1,unitPrice:price,recipientEmail:email})});showMsg(d.message||'Acha reyisi.',true);const tx=d.order?.transactionId;document.getElementById(`result-${id}`).innerHTML=tx?`Transaction: ${tx} <button class="priceBtn" onclick="codes('${tx}',${id})">Show code</button>`:'Acha fini.';const u=await refreshDlmUser();if(u)document.getElementById('serviceBalance').innerText=`$${Number(u.balance||0).toFixed(2)} USD`;}catch(e){showMsg(e.message);}}async function codes(tx,id){try{const d=await dlmApi(`/reloadly/giftcards/orders/${encodeURIComponent(tx)}/cards`);document.getElementById(`result-${id}`).innerText=JSON.stringify(d.cards);}catch(e){showMsg(e.message);}}loadProducts();</script></body></html>
