<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Prime Video - DLM Wallet</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="fixed-bottom-nav.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--accent:#00a8e1;--accent2:#146eb4;--line:rgba(255,255,255,.08);--muted:#9299aa}
body{background:#05070c;color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:#151923;border:1px solid var(--line);padding:13px 16px;border-radius:15px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}
.hero,.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:23px;padding:20px;margin-bottom:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.title{font-size:32px;font-weight:950;margin:7px 0 8px}
.sub{font-size:13px;color:var(--muted);line-height:1.5}
.balance{font-size:34px;font-weight:950;margin-top:7px}
label{display:block;font-size:13px;font-weight:800;margin:11px 0 7px}
.select{width:100%;padding:15px;border-radius:15px;background:#111724;border:1px solid var(--line);color:#fff;margin-bottom:14px}
.wallet-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:#141925;border:1px solid var(--line);margin-bottom:14px}
.wallet-left{display:flex;align-items:center;gap:11px}
.wallet-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.wallet-title{font-size:13px;font-weight:900}
.wallet-sub{font-size:11px;color:var(--muted);margin-top:3px}
.check{color:#52dc85}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:16px}
.btn:disabled{opacity:.55}
.msg{display:none;padding:13px;border-radius:14px;margin-bottom:13px;line-height:1.45}
.msg.ok{display:block;background:rgba(34,197,94,.14);color:#5ee48b}
.msg.err{display:block;background:rgba(239,68,68,.14);color:#ff8f98}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" href="services.html">← Retounen</a>
    <div class="avatar" id="avatar">D</div>
  </div>

  <div class="hero">
    <div class="eyebrow">Digital service</div>
    <div class="title">Prime Video</div>
    <div class="sub">Chwazi plan an epi peye dirèkteman ak DLM Wallet ou.</div>
    <div class="eyebrow" style="margin-top:16px">Wallet balance</div>
    <div class="balance" id="serviceBalance">$0.00 USD</div>
  </div>

  <div class="card">
    <div id="msg" class="msg"></div>

    <label>Plan</label>
    <select class="select" id="plan"><option value="1 Month|8.99">1 Month — $8.99</option><option value="3 Months|24.99">3 Months — $24.99</option><option value="12 Months|79.99">12 Months — $79.99</option></select>

    <div class="wallet-box">
      <div class="wallet-left">
        <div class="wallet-icon"><i class="fa-solid fa-wallet"></i></div>
        <div>
          <div class="wallet-title">DLM Wallet</div>
          <div class="wallet-sub">Peman fèt ak balans ou.</div>
        </div>
      </div>
      <i class="fa-solid fa-circle-check check"></i>
    </div>

    <button class="btn" id="orderBtn" onclick="submitOrder()">Pay & Continue</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="statement.html" class="nav-item"><i class="fa-solid fa-arrow-rotate-left"></i><span>Transactions</span></a>
  <a href="services.html" class="nav-item active"><i class="fa-brands fa-bitcoin"></i><span>Services</span></a>
  <a href="card-dashboard.html" class="nav-item"><i class="fa-regular fa-credit-card"></i><span>Cards</span></a>
  <a href="wallet.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
</div>

<script src="app.js"></script>
<script>
requireDlmLogin();

function showMsg(text, ok=false){
  const e=document.getElementById("msg");
  e.className="msg "+(ok?"ok":"err");
  e.innerText=text;
}

async function submitOrder(){
  const [plan,price]=document.getElementById("plan").value.split("|");
  const amount=Number(price);
  const btn=document.getElementById("orderBtn");

  if(!confirm(`Konfime Prime Video ${plan} pou $${amount.toFixed(2)}?`)) return;

  btn.disabled=true;
  btn.innerText="Processing...";

  try{
    const data=await dlmApi("/service-orders",{
      method:"POST",
      body:JSON.stringify({
        service:"Prime Video",
        plan,
        amount
      })
    });

    showMsg(data.message||"Order resevwa.",true);

    const user=await refreshDlmUser();
    if(user){
      document.getElementById("serviceBalance").innerText=
        `$${Number(user.balance||0).toFixed(2)} USD`;
    }
  }catch(error){
    showMsg(error.message);
  }finally{
    btn.disabled=false;
    btn.innerText="Pay & Continue";
  }
}
</script>
</body>
</html>
