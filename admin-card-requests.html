<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Card Requests</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="fixed-bottom-nav.css"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--bg:#05070c;--panel:#10141d;--line:rgba(255,255,255,.08);--muted:#9199ab;--primary:#5662ff;--primary2:#7868ff}
body{background:var(--bg);color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:#fff;text-decoration:none;background:#151923;border:1px solid var(--line);padding:13px 16px;border-radius:15px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:900}
.hero,.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.title{font-size:31px;font-weight:950;margin:7px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.balance{font-size:35px;font-weight:950;margin-top:7px}
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0}.step{height:5px;border-radius:999px;background:#252a36}.step.active{background:linear-gradient(90deg,var(--primary),var(--primary2))}
label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}.input,.select{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#111724;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;font-weight:900}.btn.secondary{background:#171c27;border:1px solid var(--line)}.btn:disabled{opacity:.5}
.msg{display:none;padding:13px;border-radius:14px;margin-bottom:13px}.msg.ok{display:block;background:rgba(34,197,94,.14);color:#5ee48b}.msg.err{display:block;background:rgba(239,68,68,.14);color:#ff8f98}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}.row:last-child{border-bottom:0}
.small{font-size:11px;color:var(--muted);line-height:1.45}.strong{font-weight:900}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.07)}.pill.good{background:rgba(54,214,125,.12);color:#59e38c}.pill.warn{background:rgba(250,204,21,.12);color:#facc15}.pill.bad{background:rgba(239,68,68,.12);color:#ff8e96}
.upload{display:block;border:1px dashed rgba(255,255,255,.16);border-radius:17px;padding:18px;text-align:center;background:#111620;cursor:pointer;margin-bottom:12px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
</style></head><body>
<div class="app"><div class="top"><a class="back" href="admin.html">← Admin</a><div class="avatar">A</div></div><div class="hero"><div class="title">Card Requests</div><div class="sub">Approve/reject applications.</div></div><div id="items"></div></div>
<script src="app.js"></script><script>
requireDlmAdmin();
async function load(){const d=await dlmApi("/admin/card-requests");document.getElementById("items").innerHTML=(d.requests||[]).map(r=>`<div class="card"><div class="strong">${r.userId?.name||""}</div><div class="small">${r.userId?.email||""}</div><div class="row"><span>Fee</span><b>$${Number(r.fee).toFixed(2)} USD</b></div><div class="row"><span>Status</span><span>${r.status}</span></div><button class="btn" onclick="act('${r._id}','approve')">Approve</button><button class="btn secondary" style="margin-top:9px" onclick="act('${r._id}','reject')">Reject</button></div>`).join("")}
async function act(id,action){if(!confirm(action+" request?"))return;await dlmApi("/admin/card-requests/"+id,{method:"PATCH",body:JSON.stringify({action})});load()}load();
</script></body></html>
