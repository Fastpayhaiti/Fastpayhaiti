<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DLM Wallet Register</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;background:#05070c;color:#fff}.app{max-width:430px;margin:auto;min-height:100vh;padding:24px 18px 30px;background:radial-gradient(circle at top left,rgba(59,130,246,.10),transparent 30%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 28%),#05070c}.brand-wrap{text-align:center;margin-bottom:28px}.logo{width:74px;height:74px;margin:0 auto 16px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2f3cff,#5d6bff);font-size:30px;font-weight:800}.title{font-size:34px;font-weight:800;margin-bottom:10px}.sub{color:#8b93a7;font-size:14px;line-height:1.6}.form-box{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:18px}.notice{display:none;margin-bottom:14px;padding:14px;border-radius:16px;font-size:14px;font-weight:700}.notice.err{background:rgba(217,60,75,.18);color:#ffb4bf}.notice.ok{background:rgba(17,156,103,.18);color:#7ff0be}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:#d7deee}.input-wrap{position:relative;margin-bottom:14px}.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7f879b}input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#fff;padding:15px 14px 15px 42px;font-size:15px;outline:none}.btn{width:100%;border:none;border-radius:18px;background:#2f3cff;color:#fff;font-size:16px;font-weight:800;padding:16px;cursor:pointer}.btn:disabled{opacity:.6}.extra{margin-top:16px;text-align:center;color:#8b93a7;font-size:14px}.extra a{color:#cfd5ff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="app">
<div class="brand-wrap"><div class="logo">D</div><div class="title">Register</div><div class="sub">Kreye kont DLM Wallet ou pou jere wallet ou, sèvis ou yo, ak kat dijital ou yo.</div></div>
<div class="form-box">
<div id="noticeBox" class="notice err"></div>
<label>Full Name</label><div class="input-wrap"><i class="fa-regular fa-user"></i><input type="text" id="fullname" autocomplete="name" placeholder="Antre non konplè ou"></div>
<label>Email</label><div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="email" autocomplete="email" placeholder="Antre email ou"></div>
<label>Phone</label><div class="input-wrap"><i class="fa-solid fa-phone"></i><input type="tel" id="phone" autocomplete="tel" placeholder="Antre nimewo telefòn ou"></div>
<label>Password</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="password" autocomplete="new-password" placeholder="Omwen 8 karaktè"></div>
<button class="btn" id="registerBtn" onclick="registerUser()">Create Account</button>
<div class="extra">Ou deja gen kont? <a href="login.html">Konekte</a></div>
</div></div>
<script src="js/app.js"></script>
<script>
function showNotice(message,isError=true){const box=document.getElementById("noticeBox");box.style.display="block";box.className=isError?"notice err":"notice ok";box.innerText=message;}
async function registerUser(){
  const fullname=document.getElementById("fullname").value.trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const phone=document.getElementById("phone").value.trim();
  const password=document.getElementById("password").value;
  const btn=document.getElementById("registerBtn");
  if(!fullname||!email||!phone||!password){showNotice("Tanpri ranpli tout chan yo.");return;}
  if(password.length<8){showNotice("Modpas la dwe gen omwen 8 karaktè.");return;}
  btn.disabled=true;btn.innerText="Ap kreye kont...";
  try{
    await registerDlmUser({fullname,email,phone,password});
    showNotice("Kont lan kreye avèk siksè. Ou ka konekte kounye a.",false);
    setTimeout(()=>window.location.replace("login.html"),1200);
  }catch(error){
    showNotice(error.message);btn.disabled=false;btn.innerText="Create Account";
  }
}
</script>
</body></html>
