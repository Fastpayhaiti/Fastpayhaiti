<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DLM Wallet Profile</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#05070c;color:#fff}.app{max-width:430px;margin:auto;min-height:100vh;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:12px 14px;border-radius:14px}.avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:26px;font-weight:800;margin:0 auto 12px}.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:16px}.title{text-align:center;font-size:26px;font-weight:800;margin-bottom:6px}.sub{text-align:center;color:#8b93a7;margin-bottom:18px}.row{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.row:last-child{border-bottom:none}.label{font-size:12px;color:#8b93a7;margin-bottom:6px}.value{font-size:16px;font-weight:700;word-break:break-word}.btn{width:100%;border:0;border-radius:16px;padding:15px;background:#151922;color:#ffb4b4;font-weight:800;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="dashboard.html">← Retour</a></div>
  <div class="card">
    <div class="avatar" id="avatar">D</div>
    <div class="title" id="name">DLM User</div>
    <div class="sub">Profile & Settings</div>
    <div class="row"><div class="label">Email</div><div class="value" id="email">--</div></div>
    <div class="row"><div class="label">Phone</div><div class="value" id="phone">--</div></div>
    <div class="row"><div class="label">Role</div><div class="value" id="role">customer</div></div>
    <div class="row"><div class="label">Status</div><div class="value" id="status">Active</div></div>
  </div>
  <div class="card">
    <div class="row"><div class="label">Security PIN</div><div class="value">PIN ap aktive nan pwochen patch backend la.</div></div>
  </div>
  <button class="btn" onclick="logoutDlmUser()">Logout</button>
</div>
<script src="js/app.js"></script>
<script>
function paint(u){
  if(!u)return;
  const name=u.fullname||u.name||"DLM User";
  document.getElementById("avatar").innerText=name.charAt(0).toUpperCase();
  document.getElementById("name").innerText=name;
  document.getElementById("email").innerText=u.email||"--";
  document.getElementById("phone").innerText=u.phone||"--";
  document.getElementById("role").innerText=u.role||"customer";
  document.getElementById("status").innerText=u.status||"Active";
}
paint(requireDlmLogin());
refreshDlmUser().then(paint);
</script>
</body>
                                                      </html>
