<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Create PIN - DLM Wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(410px,100%);background:#10141d;border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:25px}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#5662ff,#7868ff);font-weight:950;font-size:24px;margin-bottom:17px}
h1{font-size:28px;margin:0 0 8px}.sub{color:#9299aa;font-size:13px;line-height:1.5;margin-bottom:19px}
label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}
input{width:100%;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:#111724;color:#fff;font-size:16px}
.pin{letter-spacing:.28em;text-align:center;font-size:20px}
button{width:100%;margin-top:15px;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,#5662ff,#7868ff);color:#fff;font-size:16px;font-weight:900}
.msg{margin-top:13px;font-size:13px;line-height:1.5}.ok{color:#5ee48b}.err{color:#ff8f98}.back{display:block;text-align:center;margin-top:15px;color:#aeb5ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>Create security PIN</h1>
  <div class="sub">PIN sa ap pwoteje DLM Wallet ou. Apre ou debloke app la, ou pap bezwen antre li ankò pandan menm sesyon an.</div>

  <label>Current password</label>
  <input id="password" type="password" autocomplete="current-password">

  <label>New 6-digit PIN</label>
  <input id="pin1" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

  <label>Confirm PIN</label>
  <input id="pin2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

  <button id="btn" onclick="createPin()">Create PIN</button>
  <div id="msg" class="msg"></div>
  <a class="back" href="dashboard.html">Retounen</a>
</div>
<script src="app.js"></script>
<script>
requireDlmLogin();

for(const id of ["pin1","pin2"]){
  document.getElementById(id).addEventListener("input",e=>{
    e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);
  });
}

async function createPin(){
  const password=document.getElementById("password").value;
  const pin1=document.getElementById("pin1").value;
  const pin2=document.getElementById("pin2").value;
  const msg=document.getElementById("msg");
  const btn=document.getElementById("btn");

  msg.className="msg";
  msg.innerText="";

  if(!password){
    msg.className="msg err";msg.innerText="Antre modpas kont ou.";return;
  }
  if(!/^\d{6}$/.test(pin1)){
    msg.className="msg err";msg.innerText="PIN lan dwe gen 6 chif.";return;
  }
  if(pin1!==pin2){
    msg.className="msg err";msg.innerText="De PIN yo pa menm.";return;
  }

  btn.disabled=true;btn.innerText="Creating...";

  try{
    const data=await dlmApi("/pin/setup",{
      method:"POST",
      body:JSON.stringify({pin:pin1,currentPassword:password})
    });

    if(data.pinToken)setDlmPinUnlock(data.pinToken);

    const user=await refreshDlmUser();
    sessionStorage.removeItem("dlm_pin_setup_dismissed");

    msg.className="msg ok";
    msg.innerText="PIN aktive avèk siksè.";

    setTimeout(()=>location.replace("dashboard.html"),650);
  }catch(error){
    msg.className="msg err";
    msg.innerText=error.message||"Pa rive kreye PIN lan.";
  }finally{
    btn.disabled=false;btn.innerText="Create PIN";
  }
}
</script>
</body>
</html>
