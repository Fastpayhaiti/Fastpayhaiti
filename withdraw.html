<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DLM Wallet - Withdraw</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05070c;color:#fff;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px 40px;background:radial-gradient(circle at top left,rgba(59,130,246,.10),transparent 30%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 28%),#05070c}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.back{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center}
.title{font-size:26px;font-weight:900}.sub{color:#8b93a7;font-size:14px;line-height:1.5;margin-top:6px;margin-bottom:18px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:16px}
.balance{font-size:30px;font-weight:900;margin-top:6px}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.method{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;border-radius:16px;padding:16px;text-align:left;cursor:pointer}
.method.active{border-color:#5967ff;background:rgba(89,103,255,.12)}
.method strong{display:block;margin-bottom:5px}.method small{color:#8b93a7}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 8px;color:#d7deee}
input,textarea{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.05);color:#fff;padding:14px;font-size:15px;outline:none}
textarea{min-height:90px;resize:vertical}
.btn{width:100%;border:0;border-radius:17px;background:#2f3cff;color:#fff;padding:16px;font-size:16px;font-weight:900;margin-top:16px;cursor:pointer}
.btn:disabled{opacity:.6}
.notice{display:none;padding:13px;border-radius:14px;margin-bottom:14px;font-size:13px;font-weight:700;line-height:1.45}
.notice.error{display:block;background:rgba(217,60,75,.18);color:#ffb4bf}
.notice.success{display:block;background:rgba(17,156,103,.18);color:#7ff0be}
.info{font-size:12px;color:#8b93a7;line-height:1.55;margin-top:12px}
.status-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.status-item{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);font-size:13px}
.status-item b{display:block;margin-bottom:5px}
.pending{color:#ffd76a}.processing{color:#7dd3fc}.approved{color:#4ade80}.rejected{color:#ff9eaa}

/* ===== DLM PAYOUT BRAND UPGRADE ===== */
.method{
  position:relative;
  min-height:132px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  transition:.2s ease;
}
.method:hover{transform:translateY(-1px)}
.method .brand-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.method .brand-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  object-fit:contain;
  background:#fff;
  padding:5px;
  flex:0 0 auto;
}
.method .brand-icon{
  width:52px;
  height:52px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:#fff;
  color:#111827;
  flex:0 0 auto;
}
.method .brand-copy strong{display:block;margin:0 0 4px;font-size:16px}
.method .brand-copy small{display:block;color:#9299aa;line-height:1.3}
.method[data-method="MonCash"]{background:linear-gradient(145deg,rgba(236,23,61,.15),rgba(255,255,255,.035))}
.method[data-method="NatCash"]{background:linear-gradient(145deg,rgba(244,124,32,.15),rgba(255,255,255,.035))}
.method[data-method="Bank"]{background:linear-gradient(145deg,rgba(38,132,255,.12),rgba(255,255,255,.035))}
.method[data-method="MonCash"].active{border-color:#ef233c;box-shadow:0 0 0 1px rgba(239,35,60,.25) inset}
.method[data-method="NatCash"].active{border-color:#f58220;box-shadow:0 0 0 1px rgba(245,130,32,.25) inset}
.method[data-method="Bank"].active{border-color:#3b82f6;box-shadow:0 0 0 1px rgba(59,130,246,.25) inset}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="dashboard.html" class="back"><i class="fa-solid fa-arrow-left"></i></a>
    <div style="width:46px"></div>
  </div>

  <div class="title">Withdraw USD</div>
  <div class="sub">Voye yon demann retrè. Montan an ap rezève pandan demann lan Pending. Si admin Reject li, balans lan ap retounen sou kont ou.</div>

  <div class="card">
    <div style="color:#8b93a7;font-size:13px">Available balance</div>
    <div class="balance" id="balance">$0.00 USD</div>
  </div>

  <div class="card">
    <div style="font-weight:900;margin-bottom:12px">Choose payout method</div>

    <div class="method-grid">
      <button class="method active" data-method="MonCash" onclick="selectMethod(this)">
        <div class="brand-head">
          <img class="brand-logo" src="https://cdn.aptoide.com/imgs/d/6/f/d6fb107b85364c2fc2e2376995f3aed3_icon.jpg" alt="MonCash logo">
          <div class="brand-copy">
            <strong>MonCash</strong>
            <small>Receive on MonCash</small>
          </div>
        </div>
      </button>

      <button class="method" data-method="NatCash" onclick="selectMethod(this)">
        <div class="brand-head">
          <img class="brand-logo" src="https://i.pinimg.com/564x/d1/44/96/d144965d8de439a0d8d6689b85fe4093.jpg" alt="NatCash logo">
          <div class="brand-copy">
            <strong>NatCash</strong>
            <small>Receive on NatCash</small>
          </div>
        </div>
      </button>

      <button class="method" data-method="Bank" onclick="selectMethod(this)">
        <div class="brand-head">
          <div class="brand-icon"><i class="fa-solid fa-building-columns"></i></div>
          <div class="brand-copy">
            <strong>Bank</strong>
            <small>Bank payout</small>
          </div>
        </div>
      </button>
    </div>

    <div id="notice" class="notice"></div>

    <label>Amount (USD)</label>
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="Eg. 25.00">

    <label>Receiving account / number</label>
    <input id="account" type="text" maxlength="120" placeholder="MonCash/NatCash number or bank account">

    <label>Note (optional)</label>
    <textarea id="note" maxlength="300" placeholder="Optional note"></textarea>

    <button id="submitBtn" class="btn" onclick="submitWithdrawal()">Submit Withdrawal Request</button>
  </div>

  <div class="card">
    <div style="font-weight:900">My recent withdrawals</div>
    <div id="myWithdrawals" class="status-list">
      <div class="status-item">Ap chaje...</div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requireDlmLogin();

let selectedMethod="MonCash";

function selectMethod(button){
  document.querySelectorAll(".method").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  selectedMethod=button.dataset.method;
}

function showNotice(message,ok=false){
  const box=document.getElementById("notice");
  box.className=ok?"notice success":"notice error";
  box.innerText=message;
}

async function submitWithdrawal(){
  const amount=Number(document.getElementById("amount").value);
  const account=document.getElementById("account").value.trim();
  const note=document.getElementById("note").value.trim();
  const btn=document.getElementById("submitBtn");

  if(!Number.isFinite(amount)||amount<=0){
    showNotice("Antre yon montan USD valab.");
    return;
  }

  if(!account){
    showNotice("Antre kont oswa nimewo ki pral resevwa lajan an.");
    return;
  }

  btn.disabled=true;
  btn.innerText="Ap voye demann...";

  try{
    const data=await dlmApi("/withdraw",{
      method:"POST",
      body:JSON.stringify({
        amount,
        method:selectedMethod,
        account,
        note
      })
    });

    showNotice(data.message||"Demann retrè a voye.",true);

    document.getElementById("amount").value="";
    document.getElementById("account").value="";
    document.getElementById("note").value="";

    if(typeof data.balance!=="undefined"){
      document.getElementById("balance").innerText=`$${Number(data.balance||0).toFixed(2)} USD`;
    }

    await loadWithdrawals();
  }catch(error){
    showNotice(error.message);
  }finally{
    btn.disabled=false;
    btn.innerText="Submit Withdrawal Request";
  }
}

async function loadWithdrawals(){
  try{
    const data=await dlmApi("/withdrawals/mine");
    const items=data.withdrawals||[];
    const box=document.getElementById("myWithdrawals");

    if(!items.length){
      box.innerHTML='<div class="status-item">Pa gen demann retrè pou kounye a.</div>';
      return;
    }

    box.innerHTML=items.slice(0,8).map(w=>`
      <div class="status-item">
        <b>$${Number(w.amount||0).toFixed(2)} USD · ${w.method||"--"}</b>
        Account: ${w.account||"--"}<br>
        Status: <span class="${w.status}">${String(w.status||"").toUpperCase()}</span>
      </div>
    `).join("");

  }catch(error){
    document.getElementById("myWithdrawals").innerHTML='<div class="status-item">Pa rive chaje retrè yo.</div>';
  }
}

refreshDlmUser().then(u=>{
  if(u){
    document.getElementById("balance").innerText=`$${Number(u.balance||0).toFixed(2)} USD`;
  }
});

loadWithdrawals();
</script>
</body>
</html>
