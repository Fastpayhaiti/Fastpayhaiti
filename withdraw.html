<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw - DLM Wallet</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#05070c;color:#fff;min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 110px;background:radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 28%),radial-gradient(circle at top right,rgba(99,102,241,.10),transparent 25%),#05070c}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:13px 16px;border-radius:14px}.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-weight:800}.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:18px}.title{font-size:30px;font-weight:800;margin-bottom:10px}.sub{color:#8b93a7;line-height:1.5;margin-bottom:16px}.balance{font-size:34px;font-weight:800}.input{width:100%;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1);background:#11172a;color:#fff;margin:8px 0 14px}.btn{width:100%;padding:16px;border:0;border-radius:17px;background:#2f3cff;color:#fff;font-weight:800;font-size:16px}.msg{margin-top:14px;padding:13px;border-radius:13px;display:none}.ok{display:block;background:rgba(34,197,94,.14);color:#4ade80}.err{display:block;background:rgba(239,68,68,.14);color:#f87171}</style></head><body><div class="app"><div class="top"><a class="back" href="dashboard.html">← Retounen</a><div class="avatar" id="av">A</div></div><div class="card"><div class="title">Withdraw</div><div class="sub">Balans aktyèl ou</div><div class="balance" id="bal">0 HTG</div></div><div class="card"><label>Montan HTG</label><input class="input" id="amount" type="number" min="1" placeholder="Antre montan an"><button class="btn" onclick="submitTx()">Kontinye</button><div id="msg" class="msg"></div></div></div><script src="app.js"></script><script>const u=requireLogin();if(u){av.textContent=(u.fullname||'A')[0].toUpperCase();bal.textContent=getUserBalance(u)+' HTG';}function submitTx(){const a=Number(amount.value);const m=document.getElementById('msg');if(!a||a<=0){m.className='msg err';m.textContent='Antre yon montan valab.';return;}let b=getUserBalance();let nb=b+(-1*a);if(nb<0){m.className='msg err';m.textContent='Balans ou pa sifi.';return;}const fresh=setUserBalance(nb);bal.textContent=fresh.balance+' HTG';const key='dlm_transactions_'+fresh.id;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({id:'TX_'+Date.now(),type:'withdraw',service:'Withdraw',amount:a+' HTG',date:new Date().toLocaleString(),status:'Completed'});localStorage.setItem(key,JSON.stringify(arr));m.className='msg ok';m.textContent='Withdraw an anrejistre avèk siksè.';amount.value='';}</script></body></html>
