<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DLM Wallet Admin Customers</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#05070c;color:#fff}.app{max-width:700px;margin:auto;min-height:100vh;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.07);padding:12px 14px;border-radius:14px}.title{font-size:30px;font-weight:800}.sub{color:#8b93a7;margin-top:6px}.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;margin-bottom:12px}.name{font-size:18px;font-weight:800;margin-bottom:6px}.meta{color:#aab3c5;font-size:14px;line-height:1.6;word-break:break-word}.balance{font-size:20px;font-weight:800;margin-top:10px}.empty{color:#8b93a7;padding:20px 0}.btn{border:0;border-radius:14px;padding:12px 14px;background:#2f3cff;color:#fff;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="dashboard.html">← Dashboard</a><button class="btn" onclick="loadUsers()">Refresh</button></div>
  <div class="title">Customers</div>
  <div class="sub">Tout kliyan ki kreye kont sou DLM Wallet.</div>
  <div id="list" style="margin-top:18px;"><div class="empty">Ap chaje kliyan yo...</div></div>
</div>
<script src="js/app.js"></script>
<script>
requireDlmAdmin();
async function loadUsers(){
  const box=document.getElementById("list");
  box.innerHTML='<div class="empty">Ap chaje kliyan yo...</div>';
  try{
    const data=await dlmApi("/admin/users");
    const users=data.users||[];
    if(!users.length){box.innerHTML='<div class="empty">Pa gen kliyan pou kounye a.</div>';return;}
    box.innerHTML=users.map(u=>`
      <div class="card">
        <div class="name">${u.name||u.fullname||"DLM User"}</div>
        <div class="meta">
          Email: ${u.email||"--"}<br>
          Phone: ${u.phone||"--"}<br>
          Role: ${u.role||"customer"}<br>
          Status: ${u.status||"Active"}<br>
          Created: ${u.createdAt ? new Date(u.createdAt).toLocaleString() : "--"}
        </div>
        <div class="balance">${Number(u.balance||0).toFixed(2)} HTG</div>
      </div>
    `).join("");
  }catch(error){
    box.innerHTML=`<div class="empty">${error.message}</div>`;
  }
}
loadUsers();
</script>
</body>
</html>
