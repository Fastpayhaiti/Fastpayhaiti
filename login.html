<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Login - DLM Wallet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--bg:#05070c;--panel:#10131a;--line:rgba(255,255,255,.08);--muted:#9098ab;--p1:#5662ff;--p2:#7868ff}
body{background:var(--bg);color:#fff;min-height:100vh}
.app{width:min(430px,100%);margin:auto;padding:72px 20px 40px}
.logo{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p1),var(--p2));font-size:30px;font-weight:950;margin-bottom:30px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#9ca4bb;margin-bottom:9px}
h1{font-size:38px;font-weight:950;letter-spacing:-.04em;margin-bottom:10px}.sub{color:var(--muted);font-size:15px;margin-bottom:28px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:25px;padding:22px}
.msg{display:none;padding:13px 14px;border-radius:14px;margin-bottom:16px;background:rgba(239,68,68,.16);color:#ff9aa2;line-height:1.4}
label{display:block;font-size:13px;font-weight:900;margin:13px 0 8px}
input{width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:#111724;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#6670ff;box-shadow:0 0 0 3px rgba(86,98,255,.12)}
.btn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:17px;font-weight:950}
.btn:disabled{opacity:.55}.link{text-align:center;margin-top:17px}.link a{color:#aeb5ff;text-decoration:none;font-weight:850}.create{text-align:center;color:var(--muted);margin-top:25px}.create a{color:#aeb5ff;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="app">
  <div class="logo">D</div>
  <div class="eyebrow">DLM WALLET</div>
  <h1>Welcome back</h1>
  <div class="sub">Secure access to your wallet.</div>

  <div class="card">
    <div id="msg" class="msg"></div>

    <label>Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="your@email.com">

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Your password">

    <button id="loginBtn" class="btn" type="button" onclick="doLogin()">Login</button>

    <div class="link"><a href="forgot-password.html">Forgot password?</a></div>
    <div class="create">Pa gen kont? <a href="register.html">Create account</a></div>
  </div>
</div>

<script src="app.js"></script>
<script>
function showLoginError(text){
  const box=document.getElementById("msg");
  box.style.display="block";
  box.innerText=text;
}

async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const btn=document.getElementById("loginBtn");

  document.getElementById("msg").style.display="none";

  if(!email||!password){
    showLoginError("Antre email ak modpas ou.");
    return;
  }

  btn.disabled=true;
  btn.innerText="Connecting...";

  try{
    clearDlmPinUnlock();
    sessionStorage.removeItem("dlm_pin_setup_dismissed");

    const data=await loginDlmUser(email,password);

    if(data.user?.role==="admin"){
      location.replace("admin.html");
    }else{
      location.replace("dashboard.html");
    }
  }catch(error){
    showLoginError(error.message||"Koneksyon an pa reyisi.");
  }finally{
    btn.disabled=false;
    btn.innerText="Login";
  }
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key==="Enter")doLogin();
});
</script>
</body>
</html>
