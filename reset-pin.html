<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset PIN - DLM Wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(410px,100%);background:#10141d;border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:25px}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#5662ff,#7868ff);font-weight:950;font-size:24px;margin-bottom:17px}
h1{font-size:28px;margin:0 0 8px}.sub{color:#9299aa;font-size:13px;line-height:1.5;margin-bottom:19px}
label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}
input{width:100%;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:#111724;color:#fff;font-size:19px;letter-spacing:.24em;text-align:center}
button{width:100%;margin-top:15px;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,#5662ff,#7868ff);color:#fff;font-size:16px;font-weight:900}
.msg{margin-top:13px;font-size:13px;line-height:1.5}.ok{color:#5ee48b}.err{color:#ff8f98}
a{color:#aeb5ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>Reset PIN</h1>
  <div class="sub">Chwazi yon nouvo PIN 6 chif pou DLM Wallet ou.</div>

  <label>New PIN</label>
  <input id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

  <label>Confirm PIN</label>
  <input id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

  <button id="btn" onclick="resetPin()">Reset PIN</button>
  <div id="msg" class="msg"></div>
</div>

<script>
const API_BASE="https://fastpayhaiti.onrender.com";
const token=new URLSearchParams(location.search).get("token")||"";

for(const id of ["pin1","pin2"]){
  document.getElementById(id).addEventListener("input",e=>{
    e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);
  });
}

async function resetPin(){
  const p1=document.getElementById("pin1").value;
  const p2=document.getElementById("pin2").value;
  const msg=document.getElementById("msg");
  const btn=document.getElementById("btn");

  msg.className="msg";
  msg.innerText="";

  if(!token){
    msg.className="msg err";
    msg.innerText="Lyen reset la pa valab.";
    return;
  }

  if(!/^\d{6}$/.test(p1)){
    msg.className="msg err";
    msg.innerText="PIN lan dwe gen 6 chif.";
    return;
  }

  if(p1!==p2){
    msg.className="msg err";
    msg.innerText="De PIN yo pa menm.";
    return;
  }

  btn.disabled=true;
  btn.innerText="Resetting...";

  try{
    const r=await fetch(`${API_BASE}/pin/reset-email`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,newPin:p1})
    });

    const d=await r.json().catch(()=>({}));

    if(!r.ok)throw new Error(d.message||"Reset PIN echwe.");

    msg.className="msg ok";
    msg.innerHTML=(d.message||"PIN reset.")+' <a href="login.html">Konekte ankò</a>';
  }catch(e){
    msg.className="msg err";
    msg.innerText=e.message;
  }finally{
    btn.disabled=false;
    btn.innerText="Reset PIN";
  }
}
</script>
</body>
</html>
